<!DOCTYPE html>
<html lang="en-Us">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Submit a product review including rating, installation date, useful features, and written feedback. Keep track of your reviews with our confirmation page.">
  <meta name="author" content="Akanimo Jackson">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      
      <label for="product">Product Name <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset>
        <legend>Overall Rating <span class="required">*</span></legend>

        <label>
          <input type="radio" name="rating" value="1" required>
          ★☆☆☆☆
        </label>

        <label>
          <input type="radio" name="rating" value="2">
          ★★☆☆☆
        </label>

        <label>
          <input type="radio" name="rating" value="3">
          ★★★☆☆
        </label>

        <label>
          <input type="radio" name="rating" value="4">
          ★★★★☆
        </label>

        <label>
          <input type="radio" name="rating" value="5">
          ★★★★★
        </label>
      </fieldset>

      <label for="installDate">Date Installed <span class="required">*</span></label>
      <input type="date" id="installDate" name="installDate" required>

      <fieldset>
        <legend>Useful Features (check all that apply)</legend>

        <label>
          <input type="checkbox" id="feature1" name="features" value="Ease of Use"> Ease of Use
        </label>

        <label>
          <input type="checkbox" id="feature2" name="features" value="Durability"> Durability
        </label>

        <label>
          <input type="checkbox" id="feature3" name="features" value="Design"> Design
        </label>

        <label>
          <input type="checkbox" id="feature4" name="features" value="Performance"> Performance
        </label>
      </fieldset>

      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="5" placeholder="Write your review (optional)..."></textarea>

      <label for="userName">Your Name (optional)</label>
      <input type="text" id="userName" name="userName" placeholder="Enter your name">

      <input type="submit" value="Submit Review">
      
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> | <span id="lastModified"></span> | Akanimo Jackson</p>
  </footer>

</body>
</html>
